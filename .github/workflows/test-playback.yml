
name: Test Playback Master

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install requests

      - name: Test Master URL
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: python scripts/test_playback.py
