
name: Test Worker Playback API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-playback:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Test Worker and Playback API
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          python scripts/test_playback.py
